<!DOCTYPE html>

<title>Sprkt</title>

<script>
/* Runs before paint so mobile visitors are redirected without seeing this page.
   No meta refresh here on purpose: a meta refresh fires unconditionally and
   would beat this detection, sending iPhone users to Google Play. */
(function () {
  var IOS_URL  = "https://apps.apple.com/app/id6799513483";
  var PLAY_URL = "https://play.google.com/store/apps/details?id=app.sprkt.maintenance";

  var ua = navigator.userAgent || navigator.vendor || "";

  /* iPadOS 13+ reports itself as a Mac, so the touch-point check is what
     actually catches iPads. Without it they fall through to the desktop path. */
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);

  if (isIOS)     { window.location.replace(IOS_URL);  return; }
  if (isAndroid) { window.location.replace(PLAY_URL); return; }
  /* Anything else (desktop, unknown) stays here and picks a store. */
})();
</script>

    --dark: #1A1E26;
    --orange: #E8682A;
    --text: #F2F2F7;
    --muted: #8E9BAE;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;

  .logo-dot {
    width: 26px; height: 26px; border-radius: 50%; background: var(--orange);
    display: flex; align-items: center; justify-content: center;
  }
  .brand { color: var(--orange); font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

  .store-badges {
    display: flex; gap: 16px; justify-content: center; align-items: center;
    flex-wrap: wrap;
  }
  .store-badges a { display: inline-flex; line-height: 0; }
  .store-badges img { height: 54px; width: auto; display: block; }
  @media (max-width: 420px) { .store-badges img { height: 46px; } }

  .home { margin-top: 32px; font-size: 12.5px; }
  .home a { color: var(--muted); text-decoration: none; }
  .home a:hover { color: var(--orange); }
  .legal { margin-top: 24px; font-size: 11px; line-height: 1.6; color: var(--muted); opacity: 0.55; }
</style>

<script>
/* Only desktop visitors reach this point. Swap to Portuguese when the browser
   asks for it; English stays the default so the page works without scripting. */
(function () {
  var lang = (navigator.language || navigator.userLanguage || "").toLowerCase();
  if (lang.indexOf("pt") !== 0) return;

  document.documentElement.lang = "pt";
  document.getElementById("title").textContent = "Instala a Sprkt";
  document.getElementById("subtitle").textContent =
    "Grátis, sem conta, sem anúncios. Os teus dados ficam no teu dispositivo.";

  var apple = document.getElementById("badge-apple");
  apple.src = "/badge-app-store-pt.svg";
  apple.alt = "Descarregar na App Store";

  var google = document.getElementById("badge-google");
  google.src = "/badge-google-play-pt.svg";
  google.alt = "Disponível no Google Play";

  document.getElementById("home-link").href = "/index-pt.html";

  document.getElementById("legal").textContent =
    "Apple e o logótipo Apple são marcas comerciais da Apple Inc., registadas nos EUA e noutros países. " +
    "App Store é uma marca de serviço da Apple Inc. Google Play e o logótipo Google Play são marcas comerciais da Google LLC.";
})();
